[Translations]
$SA_ModName=Simple Akimbo
$SA_Desc=Configuration for the Simple Akimbo mod. Dual-wielding for one-handed weapons.
$SA_Settings=Settings
$SA_SettingsPage=Akimbo Settings
$SA_ToggleKey=Toggle Akimbo
$SA_ToggleKeyTip=Key to turn Akimbo on/off. In the inventory (Pip-Boy), the same key sets the selected weapon as the left weapon.
$SA_ModeKey=Toggle mode
$SA_ModeKeyTip=Key to switch between fire mode A and B.
$SA_Mode=Fire mode
$SA_ModeTip=Mode A: LMB = left weapon, RMB = right weapon (RMB aim is disabled). Mode B: LMB alternates left/right, RMB stays aim/ADS.
$SA_ModeA=Mode A (LMB left / RMB right)
$SA_ModeB=Mode B (LMB alternating / RMB aim)
$SA_Debug=Debug messages
$SA_DebugTip=Shows additional console prints and notes for troubleshooting.
$SA_InfoHeader=Notes
$SA_InfoText=Set the left weapon in the inventory with the toggle key. Only one-handed weapons (pistols/SMGs) are supported. Two copies of the same weapon are required if left = right.
$SA_Str=Strength requirement
$SA_StrTip=Changes the strength requirement of the equipped (right) weapon while Akimbo is active. "Highest of both" uses the higher requirement of the right and the left weapon, the options below add to that value.
$SA_StrOff=+0 (free)
$SA_StrHigh=Highest of both
$SA_StrHigh1=Highest of both +1
$SA_StrHighHalf=Highest of both +50% of left
$SA_StrHighFull=Highest of both +100% of left
$SA_Skill=Skill requirement
$SA_SkillTip=Changes the skill requirement of the equipped (right) weapon while Akimbo is active. "Highest of both" uses the higher requirement of the right and the left weapon, the options below add to that value.
$SA_SkOff=+0 (free)
$SA_SkHigh=Highest of both
$SA_SkHigh25=Highest of both +25
$SA_SkHighFull=Highest of both +100% of left
